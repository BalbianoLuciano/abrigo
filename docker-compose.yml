# Servicios locales para desarrollo: PostgreSQL 16 + PostGIS y Redis.
services:
  postgres:
    image: imresamu/postgis:16-3.5 # build multi-arch (arm64 + amd64) de la imagen oficial
    environment:
      POSTGRES_USER: abrigo
      POSTGRES_PASSWORD: abrigo
      POSTGRES_DB: abrigo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abrigo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
